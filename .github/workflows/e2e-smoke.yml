name: E2E Smoke (Render)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: ["main"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: https://honeywell-frontend.onrender.com
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
      E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
      E2E_REP_EMAIL: ${{ secrets.E2E_REP_EMAIL }}
      E2E_REP_PASSWORD: ${{ secrets.E2E_REP_PASSWORD }}
      E2E_OPS_EMAIL: ${{ secrets.E2E_OPS_EMAIL }}
      E2E_OPS_PASSWORD: ${{ secrets.E2E_OPS_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Render deploy (best-effort)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Attempt $i: running e2e..."
            if npm run e2e; then
              exit 0
            fi
            echo "E2E failed. Sleeping before retry..."
            sleep 30
          done
          echo "E2E failed after retries."
          exit 1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

