name: CI

on:
  push:
    branches: [main, develop, deploy/render-sandbox]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref. A burst of merges (e.g. the
# release PR + a batch of dependabot PRs) used to spawn one full CI run
# per commit, all executing concurrently — they starved each other's
# runners and amplified Docker Hub rate-limit / pull timeouts in
# docker-build. Only the latest commit's state is what actually ships,
# so cancel the older in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: honeywell_sales
          POSTGRES_USER: honeywell
          POSTGRES_PASSWORD: honeywell
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U honeywell"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Bootstrap schema from models + verify alembic chain
        env:
          DATABASE_URL: postgresql+asyncpg://honeywell:honeywell@127.0.0.1:5432/honeywell_sales
        working-directory: backend
        run: |
          # Prod was bootstrapped via Base.metadata.create_all before alembic
          # was wired in. Mirror that: create current-state schema from the
          # live model definitions, stamp to head so alembic sees the chain
          # as applied, then `upgrade head` acts as a no-op that still
          # validates the revision graph is linear and resolvable.
          python - <<'PY'
          import asyncio
          from app.core.database import Base, engine
          from app.models import *  # noqa: F401,F403
          async def main():
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
              await engine.dispose()
          asyncio.run(main())
          PY
          python -m alembic stamp head
          python -m alembic upgrade head
      - name: Schema audit
        env:
          DATABASE_URL: postgresql+asyncpg://honeywell:honeywell@127.0.0.1:5432/honeywell_sales
        run: bash scripts/db-schema-audit.sh
      - name: Schema-introspection drift check (R4 §3)
        # Bootstrap a clean DB from migrations only (no metadata.create_all)
        # then run schema_check in fail mode. Forces every PR adding a
        # new column to also add a migration. Catches the recurring
        # R4-DB-* class of drift before merge instead of after deploy.
        #
        # v1.9.14 made this gate load-bearing again. The migration-
        # consolidation sprint added a bootstrap migration
        # (``20260101_bootstrap_legacy``) that creates every legacy
        # table the model declares, then patched all subsequent
        # ALTER/INDEX/CONSTRAINT calls to be IF NOT EXISTS-safe. Now
        # ``alembic upgrade head`` runs cleanly from an empty schema
        # and schema_check exits 0.
        env:
          DATABASE_URL: postgresql+asyncpg://honeywell:honeywell@127.0.0.1:5432/honeywell_sales
          SCHEMA_DRIFT_MODE: fail
        working-directory: backend
        run: |
          PGPASSWORD=honeywell psql -h 127.0.0.1 -U honeywell -d honeywell_sales \
            -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          python -m alembic upgrade head
          python -m app.core.schema_check

  backend-test:
    runs-on: ubuntu-latest
    needs: [backend-migrations]
    services:
      # PG service for the test suite. ``conftest.py`` defaults to
      # ``localhost:5434/honeywell_sales_test``; we map host-5434 →
      # container-5432 so the same default works in CI as locally
      # (``docker-compose.override.yml`` provides db-test on 5434).
      # Using a real PG matches prod semantics (FK enforcement,
      # ``to_char``, real transaction isolation).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: honeywell_sales_test
          POSTGRES_USER: honeywell
          POSTGRES_PASSWORD: honeywell_test_2026
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U honeywell -d honeywell_sales_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest-cov
      - name: Wait for PostgreSQL
        run: |
          for i in {1..15}; do
            nc -zv localhost 5434 && exit 0
            sleep 2
          done
          echo "::error::Postgres on :5434 never became ready"
          exit 1
      - name: Run tests with coverage
        working-directory: backend
        env:
          # Explicit override so conftest's default URL works even when
          # the runner has a stray ``DATABASE_URL`` env var (e.g. from
          # a previous job).
          TEST_DATABASE_URL: postgresql+asyncpg://honeywell:honeywell_test_2026@localhost:5434/honeywell_sales_test
        # Coverage floor is the 2-point buffer below the current baseline
        # (~47%). Don't lower it without an ADR. Don't drop --cov-fail-under
        # — that's what makes the gate actually a gate.
        run: |
          python -m pytest tests/ \
            --cov=app \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=45 \
            -q --tb=short
      - name: Upload coverage report
        if: always()
        # Round-15 — artifact-upload outages should not fail the test
        # gate. The coverage XML is diagnostic-only; the
        # ``--cov-fail-under`` flag above is what actually enforces the
        # coverage floor. The FinalizeArtifact step in
        # ``upload-artifact@v7`` has hit transient ``Unexpected token '<'``
        # errors (GitHub returning HTML error pages instead of JSON),
        # which retried 5× and still failed. ``continue-on-error`` keeps
        # the job green when the upload service is degraded.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: backend/coverage.xml
          retention-days: 30

  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: backend
        # Upgrade pip first so the audit runs against a pip release that
        # has CVE-2026-6357 patched (fix landed in pip 26.1; the runner
        # ships 26.0.1 as of 2026-05). Without this, pip-audit flags the
        # runner's own pip as vulnerable and fails the gate. The
        # CVE-2026-3219 ignore stays as a safety net for the older
        # advisory that still has no upstream fix.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit
      - name: Dependency audit (JSON report)
        id: audit
        working-directory: backend
        # ``pip-audit -f json`` returns non-zero when vulns are found, but
        # we still want the JSON so the next step can decide severity. The
        # ``|| true`` here only prevents the command itself from killing the
        # job; the gate that follows is what actually fails the build.
        # CVE-2026-3219 is a vulnerability in ``pip`` itself with no fix
        # available upstream. Tracked via dependency-audit runbook; revisit
        # when pip ships a patched release. Until then we ignore it
        # explicitly so the gate stays meaningful for everything else.
        # CVE-2026-6357 is also pip-itself; fix is in pip 26.1 which the
        # upgrade step above installs, but we keep the ignore as belt-
        # and-braces in case the runner image rolls back.
        # PYSEC-2025-183 / CVE-2025-45768 is a DISPUTED PyJWT advisory:
        # the upstream maintainers reject it because the alleged "weak
        # encryption" is determined by the application's choice of key
        # length, not by the library. The advisory has no fix_versions
        # because there is nothing in PyJWT to patch. We always pass
        # a sufficient-length key, so this is non-applicable here.
        # See: https://github.com/jpadilla/pyjwt/issues/... (disputed).
        run: pip-audit --strict --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357 --ignore-vuln PYSEC-2025-183 -f json -o pip-audit.json || true
      - name: Fail on HIGH or CRITICAL vulnerabilities
        working-directory: backend
        run: |
          # Older pip-audit emits ``[]`` when nothing is found; tolerate that.
          # Real findings are objects with ``vulns`` keyed by severity-bearing
          # advisory IDs. We use jq's ``walk`` to find any "fix_versions"-bearing
          # entry and pull severity off the GHSA/CVE ID heuristically.
          if [ ! -s pip-audit.json ]; then
            echo "::warning::pip-audit produced no JSON output"
            exit 0
          fi
          # Most pip-audit JSON shapes expose ``vulns`` per dependency. We
          # don't have access to severity from pip-audit alone, so we fail
          # whenever ANY vuln is reported and let the operator triage.
          # Dependabot security PRs handle the patch flow.
          VULN_COUNT=$(jq '[.dependencies[]?.vulns[]?] | length' pip-audit.json)
          echo "Vulnerabilities found: ${VULN_COUNT}"
          if [ "${VULN_COUNT}" -gt 0 ]; then
            jq '.dependencies[] | select(.vulns | length > 0) | {name, version, vulns}' pip-audit.json
            echo "::error::pip-audit found ${VULN_COUNT} vulnerabilities — review and fix before merging."
            exit 1
          fi
      - name: Upload audit report
        if: always()
        # Round-15 — diagnostic-only upload; the audit gate above already
        # fails on any HIGH/CRITICAL vuln. ``continue-on-error`` keeps the
        # job green during transient ``upload-artifact@v7`` outages
        # (FinalizeArtifact occasionally returns HTML instead of JSON and
        # retries-exhaust). See the parallel guard on the frontend audit.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-${{ github.sha }}
          path: backend/pip-audit.json
          retention-days: 30

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: npm audit (HIGH and CRITICAL)
        working-directory: frontend
        # ``--audit-level=high`` exits non-zero when HIGH or CRITICAL
        # vulnerabilities are found. Lower-severity advisories surface in
        # Dependabot's weekly PRs and don't gate the build.
        run: npm audit --audit-level=high --omit=dev
      - name: npm audit JSON report
        if: always()
        working-directory: frontend
        run: npm audit --json --omit=dev > npm-audit.json || true
      - name: Upload audit report
        if: always()
        # Round-15 — diagnostic-only upload; the ``npm audit
        # --audit-level=high`` step above is the actual gate.
        # ``continue-on-error`` keeps the job green when
        # ``upload-artifact@v7`` hits the FinalizeArtifact JSON-parse
        # error from a degraded blob-storage backend.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ github.sha }}
          path: frontend/npm-audit.json
          retention-days: 30

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      # Round-15 15m / Round-16: OpenAPI drift gate. Regenerate the typed
      # bindings against the live FastAPI app and verify the committed
      # file matches. Sprint 15m landed the placeholder; Round-15 16g
      # populated it; Round-16 dropped the placeholder-skip clause now
      # that the gate is actually enforcing. Commit message
      # ``[skip openapi-check]`` still bypasses for legitimate
      # dependency bumps / docs-only PRs.
      - name: Install backend dependencies (for OpenAPI dump)
        if: ${{ !contains(github.event.head_commit.message, '[skip openapi-check]') }}
        run: pip install -r backend/requirements.txt
      - name: OpenAPI types drift check
        if: ${{ !contains(github.event.head_commit.message, '[skip openapi-check]') }}
        working-directory: frontend
        run: npm run gen:api-types:check

  frontend-e2e-smoke:
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps
      - name: Run Playwright smoke (skips if creds missing)
        working-directory: frontend
        run: npx playwright test e2e/full-smoke-ui.spec.ts --reporter=line

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, frontend-e2e-smoke]
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker images
        # Retry on transient Docker Hub failures. The base-image pulls
        # (python:3.11-slim, node:20-alpine, nginx:1.25-alpine) hit
        # ``registry-1.docker.io`` and occasionally fail with
        # ``DeadlineExceeded`` / ``dial tcp ... i/o timeout`` when the
        # registry is degraded or anonymous-pull rate-limited. That's
        # infrastructure flakiness, not a build error — retry a few times
        # with backoff before failing the gate.
        run: |
          for attempt in 1 2 3; do
            echo "::group::docker compose build (attempt ${attempt}/3)"
            if docker compose build; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::docker compose build failed (attempt ${attempt}/3) — likely a transient registry timeout; retrying in 20s"
            sleep 20
          done
          echo "::error::docker compose build failed after 3 attempts"
          exit 1
