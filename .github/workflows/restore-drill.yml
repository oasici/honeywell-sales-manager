name: Monthly Restore Drill

# Proves prod backups actually restore. A backup that has never been
# restored is a hope, not a recovery plan.
on:
  schedule:
    # First of each month at 03:00 UTC (06:00 TR). Picks the lowest-traffic
    # window so a long-running pg_restore doesn't bump production latency.
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      min_users:
        description: "Override minimum users floor"
        required: false
        default: "1"
      min_opportunities:
        description: "Override minimum opportunities floor"
        required: false
        default: "0"

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_DB_BACKUP_URL: ${{ secrets.PROD_DB_BACKUP_URL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      MIN_USERS: ${{ github.event.inputs.min_users || '1' }}
      MIN_OPPORTUNITIES: ${{ github.event.inputs.min_opportunities || '0' }}
    steps:
      - uses: actions/checkout@v7

      # The drill needs prod-backup + staging-DB secrets that aren't
      # configured for the 20-30 user pilot. Treat a missing-secret run
      # as a skip-with-warning rather than a hard failure so the monthly
      # schedule doesn't paint the branch red. Once DR is provisioned and
      # the secrets are set, the drill runs for real. (CI fix 2026-06-01.)
      - name: Check restore-drill secrets
        id: secrets
        run: |
          missing=()
          [ -z "$PROD_DB_BACKUP_URL" ] && missing+=("PROD_DB_BACKUP_URL")
          [ -z "$STAGING_DATABASE_URL" ] && missing+=("STAGING_DATABASE_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Restore-drill secrets not configured (${missing[*]}). Skipping drill."
            echo "::warning::Configure under Settings → Secrets → Actions to enable DR verification."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.secrets.outputs.configured == 'true'
        with:
          python-version: "3.11"

      - name: Install Postgres client
        if: steps.secrets.outputs.configured == 'true'
        run: |
          # Use the official PGDG repo so pg_dump/pg_restore version matches
          # the production cluster (16). Default Ubuntu repos lag behind.
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -yqq postgresql-client-16

      - name: Install Python dependencies
        if: steps.secrets.outputs.configured == 'true'
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run drill
        if: steps.secrets.outputs.configured == 'true'
        run: bash backend/scripts/restore_drill.sh

      - name: Record success
        if: success() && steps.secrets.outputs.configured == 'true'
        run: |
          echo "::notice::Restore drill PASSED $(date -u +%Y-%m-%d)"

      - name: Record failure
        if: failure() && steps.secrets.outputs.configured == 'true'
        run: |
          echo "::error::Restore drill FAILED $(date -u +%Y-%m-%d) — backup integrity is at risk."
          echo "::error::See job logs and update docs/runbooks/last-restore-drill.md."
