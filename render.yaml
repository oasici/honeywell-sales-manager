# Render Blueprint - Honeywell Sales Manager
# Deploy: https://render.com/deploy?repo=https://github.com/oasici/honeywell-sales-manager

databases:
  - name: honeywell-db
    plan: free
    databaseName: honeywell_sales
    user: honeywell

services:
  # ─────────────────────── Redis (managed by Render) ─────────────────
  # Required by:
  #   - rate limiting (per-user counters survive worker restarts)
  #   - session management (FEATURE_SESSION_MANAGEMENT)
  #   - deal-health cache, AI summary cache
  # Without it, the app falls back to in-memory caches per-worker —
  # functional but loses cross-worker consistency on multi-worker
  # deployments. Render's managed Redis on the free tier is small
  # but sufficient for a single-tenant install.
  - type: redis
    name: honeywell-redis
    plan: free
    ipAllowList: []  # closed; only Render-internal services connect


  - type: web
    name: honeywell-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: honeywell-db
          property: connectionString
      - key: ENV
        value: production
      - key: PORT
        value: "8000"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@honeywell.com
      - key: DEFAULT_ADMIN_PASSWORD
        # SECURITY: never hardcode a default in blueprints; set manually in Render dashboard.
        sync: false
      - key: CORS_ORIGINS
        value: "https://honeywell-frontend.onrender.com"
      - key: ANTHROPIC_API_KEY
        sync: false
      # ── Redis (managed) ──
      - key: REDIS_URL
        fromService:
          type: redis
          name: honeywell-redis
          property: connectionString
      # ── Qdrant (external; FEATURE_RAG=true required) ──
      # Render does not host Qdrant directly. Set this to your Qdrant
      # Cloud DSN in the Render dashboard once FEATURE_RAG is on.
      # When the URL is empty, RAG endpoints return 404 indistinguishably
      # so the rest of the app stays functional.
      - key: QDRANT_URL
        sync: false
      # SECURITY: ENCRYPTION_KEY decrypts KVKK PII columns (per-row
      # encryption). If Render regenerates this on a service rebuild
      # all encrypted data becomes UNREADABLE — an irreversible data
      # loss. ``sync: false`` pins it to a manually-set Render
      # dashboard value, backed up out-of-band (1Password / Vault).
      # Generate the first value with:
      #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: ENCRYPTION_KEY
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: AUTO_SCHEMA_SYNC
        value: "false"
      # Sentry — backend DSN set manually in Render dashboard (not checked in).
      - key: SENTRY_DSN
        sync: false
      # Frontend Sentry project ID(s) authorized to tunnel through
      # /api/sentry-tunnel. Set to the project ID from VITE_SENTRY_DSN path.
      - key: SENTRY_ALLOWED_PROJECT_IDS
        sync: false
      # ── DB pool — sized for Render Postgres free tier (max_connections=97).
      # 4 workers * (10+5) = 60 connections, leaves headroom for migrations.
      # Bump these when upgrading to a paid tier with higher connection ceiling.
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "300"
      # ── Rate limits — production defaults (per-user)
      - key: RATE_LIMIT_AI
        value: "60/minute"
      - key: RATE_LIMIT_UPLOAD
        value: "10/minute"

  - type: web
    name: honeywell-frontend
    runtime: static
    rootDir: frontend
    # Re-export Render's commit SHA as VITE_GIT_COMMIT so Vite inlines it
    # into the bundle (import.meta.env reads VITE_*-prefixed vars only).
    # This keeps the Sentry SDK reporter and the source-map uploader on
    # the exact same release identifier.
    buildCommand: VITE_GIT_COMMIT="$RENDER_GIT_COMMIT" npm ci && VITE_GIT_COMMIT="$RENDER_GIT_COMMIT" npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      # 2-year HSTS with includeSubDomains + preload. Required for the
      # securityheaders.com A+ rating. Once deployed, revoking takes
      # 2 years to clear from browser caches — keep us on HTTPS.
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      # Block the legacy Adobe / Flash cross-domain policy file lookup.
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      # Window isolation: top-level documents only, no popup channels.
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # Restricts whether other origins can fetch our resources via
      # <img>/<script>. ``same-site`` keeps Render-internal sharing.
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site
      # CSP — ``'self'`` script-src + tight directives. ``'unsafe-inline'``
      # style-src is unavoidable for Tailwind-generated styles; revisit
      # when we move to a build pipeline that emits external stylesheets
      # only. Sentry hosts whitelisted in connect-src.
      # frame-src 'none' complements X-Frame-Options DENY; manifest-src
      # is needed by PWA manifest.json.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.onrender.com https://*.ingest.us.sentry.io https://*.ingest.sentry.io https://sentry.io; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests;"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://honeywell-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Use relative /api/v1 so the static site's /api/* rewrite proxies to the
      # backend. This keeps requests same-origin and avoids CORS credentials
      # issues (CORS `*` + withCredentials is rejected by browsers).
      - key: VITE_API_URL
        value: /api/v1
      # Sentry — frontend DSN set manually in Render dashboard (not checked in).
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_ENV
        value: production
      # Sentry release source map upload (build-time only). Token is
      # set in Render dashboard with `sync: false` so it's never checked
      # in. Org + project are static and safe to commit. The release
      # name comes from VITE_GIT_COMMIT (already set by Render's commit
      # SHA injection in the index env block above) so the SDK reporter
      # and the uploader use the same identifier.
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        value: onur-asc
      - key: SENTRY_PROJECT
        value: honeywell-frontend
