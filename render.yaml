# Render Blueprint - Honeywell Sales Manager
# Deploy: https://render.com/deploy?repo=https://github.com/oasici/honeywell-sales-manager

databases:
  - name: honeywell-db
    plan: free
    databaseName: honeywell_sales
    user: honeywell

services:
  - type: web
    name: honeywell-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: honeywell-db
          property: connectionString
      - key: ENV
        value: production
      - key: PORT
        value: "8000"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@honeywell.com
      - key: DEFAULT_ADMIN_PASSWORD
        # SECURITY: never hardcode a default in blueprints; set manually in Render dashboard.
        sync: false
      - key: CORS_ORIGINS
        value: "https://honeywell-frontend.onrender.com"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: AUTO_SCHEMA_SYNC
        value: "false"
      # Sentry — backend DSN set manually in Render dashboard (not checked in).
      - key: SENTRY_DSN
        sync: false
      # Frontend Sentry project ID(s) authorized to tunnel through
      # /api/sentry-tunnel. Set to the project ID from VITE_SENTRY_DSN path.
      - key: SENTRY_ALLOWED_PROJECT_IDS
        sync: false
      # ── DB pool — sized for Render Postgres free tier (max_connections=97).
      # 4 workers * (10+5) = 60 connections, leaves headroom for migrations.
      # Bump these when upgrading to a paid tier with higher connection ceiling.
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "300"
      # ── Rate limits — production defaults (per-user)
      - key: RATE_LIMIT_AI
        value: "60/minute"
      - key: RATE_LIMIT_UPLOAD
        value: "10/minute"

  - type: web
    name: honeywell-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.onrender.com https://*.ingest.us.sentry.io https://*.ingest.sentry.io https://sentry.io; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://honeywell-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Use relative /api/v1 so the static site's /api/* rewrite proxies to the
      # backend. This keeps requests same-origin and avoids CORS credentials
      # issues (CORS `*` + withCredentials is rejected by browsers).
      - key: VITE_API_URL
        value: /api/v1
      # Sentry — frontend DSN set manually in Render dashboard (not checked in).
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_ENV
        value: production
