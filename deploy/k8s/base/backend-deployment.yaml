apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsm-backend
  namespace: hsm
  labels:
    app: hsm-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hsm-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hsm-backend
    spec:
      serviceAccountName: hsm-backend
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: honeywell-sales-manager-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: hsm-backend-config
            - secretRef:
                name: hsm-backend-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1024Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

