apiVersion: v1
kind: ConfigMap
metadata:
  name: hsm-backend-config
  namespace: hsm
data:
  ENV: "production"
  PORT: "8000"
  # Explicitly disable implicit schema mutation in regulated prod.
  AUTO_CREATE_TABLES: "false"
  AUTO_SCHEMA_SYNC: "false"
  # CORS should be set per environment. Keep empty here; override in overlays.
  CORS_ORIGINS: ""
  # Feature flags are env-driven. Set them in overlays or via separate ConfigMap.

