apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hsm-backend
  namespace: hsm
  annotations:
    # Example for nginx ingress; adjust for your controller.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  tls:
    - hosts:
        - api.example.com
      secretName: hsm-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hsm-backend
                port:
                  number: 80

