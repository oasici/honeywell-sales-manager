[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# Pin test loop scope to session so asyncpg connections (bound to the
# loop on which they were created) survive across tests. With the
# default function scope the engine + connection pool would emit
# "Future attached to a different loop" on every transition.
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore:'crypt' is deprecated and slated for removal in Python 3\.13:DeprecationWarning
markers =
    schema: schema-drift checks against Base.metadata + bootstrap snapshot (R5-DB-8)
